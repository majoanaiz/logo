<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Validate Logo Animation</title>

  <!-- GSAP -->
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/MotionPathPlugin.min.js"></script>

  <style>
    body {
      margin: 0;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #container {
      position: relative;
      width: 400px;
      height: 300px;
    }

    svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

<div id="container">

  <!-- CIRCULO NARANJO -->
  <svg id="orange" width="245" height="245" viewBox="0 0 245 245">
    <path d="M122.5 0C190.156 0 245 54.845 245 122.5C245 190.155 190.156 245 122.5 245C54.845 245 0 190.155 0 122.5C0 54.845 54.845 0 122.5 0Z" fill="#F16347"/>
  </svg>

  <!-- CIRCULO AMARILLO -->
  <svg id="yellow" width="245" height="245" viewBox="0 0 245 245">
    <path d="M122.5 0C190.156 0 245 54.845 245 122.5C245 190.155 190.156 245 122.5 245C54.845 245 0 190.155 0 122.5C0 54.845 54.845 0 122.5 0Z" fill="#F0DC29"/>
  </svg>

  <!-- LOGO FINAL -->
  <svg id="finalLogo" width="392" height="302" viewBox="0 0 392 302" style="opacity:0">
    <rect width="245" height="245" rx="122.5" transform="matrix(-1 0 0 1 273.693 28.9868)" fill="#F16347"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M363.307 151.487C363.307 83.8319 308.462 28.9869 240.807 28.9869C236.113 28.9869 231.48 29.2509 226.924 29.7649C216.432 29.6063 205.908 32.1063 196.448 37.2649L182.338 47.8365L132.458 97.7166C108.352 121.822 108.352 160.905 132.457 185.01C148.351 200.904 170.757 206.318 191.087 201.253C201.751 198.678 211.862 193.228 220.187 184.903L268.291 136.799C271.689 133.165 273.05 145.26 273.05 151.487C273.05 203.205 241 247.437 195.678 265.406C209.644 270.943 224.87 273.987 240.807 273.987C308.462 273.987 363.307 219.142 363.307 151.487Z" fill="#F0DC29"/>
  </svg>

</div>

<script>
window.onload = () => {
  gsap.registerPlugin(MotionPathPlugin);

  const orange = document.getElementById("orange");
  const yellow = document.getElementById("yellow");
  const finalLogo = document.getElementById("finalLogo");

  const tl = gsap.timeline();

  const finalOffset = 110; // MENOR distancia

  tl.to(orange, {
    duration: 3,
    motionPath: {
      path: [
        {x: 0, y: 0},
        {x: 80, y: -40},
        {x: 160, y: 0},
        {x: 80, y: 40},
        {x: -finalOffset, y: 0}
      ],
      curviness: 1.4
    },
    ease: "power1.inOut"
  }, 0);

  tl.to(yellow, {
    duration: 3,
    motionPath: {
      path: [
        {x: 0, y: 0},
        {x: -80, y: 40},
        {x: -160, y: 0},
        {x: -80, y: -40},
        {x: finalOffset, y: 0}
      ],
      curviness: 1.4
    },
    ease: "power1.inOut"
  }, 0);

  tl.to({}, { duration: 0.2 });

  tl.to([orange, yellow], {
    duration: 0.3,
    opacity: 0
  });

  tl.to(finalLogo, {
    duration: 0.6,
    opacity: 1,
    ease: "power2.out"
  });
};
</script>

</body>
</html>
