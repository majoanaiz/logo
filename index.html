<script>
window.onload = () => {
  gsap.registerPlugin(MotionPathPlugin);

  const orange = document.getElementById("orange");
  const yellow = document.getElementById("yellow");
  const finalLogo = document.getElementById("finalLogo");

  if (!orange || !yellow || !finalLogo) {
    console.error("No se encontraron los SVG:", { orange, yellow, finalLogo });
    return;
  }

  const tl = gsap.timeline();

  const finalOffset = 130;

  tl.to(orange, {
    duration: 3,
    motionPath: {
      path: [
        {x: 0, y: 0},
        {x: 100, y: -60},
        {x: 200, y: 0},
        {x: 100, y: 60},
        {x: -finalOffset, y: 0}
      ],
      curviness: 1.4
    },
    ease: "power1.inOut"
  }, 0);

  tl.to(yellow, {
    duration: 3,
    motionPath: {
      path: [
        {x: 0, y: 0},
        {x: -100, y: 60},
        {x: -200, y: 0},
        {x: -100, y: -60},
        {x: finalOffset, y: 0}
      ],
      curviness: 1.4
    },
    ease: "power1.inOut"
  }, 0);

  tl.to({}, { duration: 0.2 });

  tl.to([orange, yellow], {
    duration: 0.3,
    opacity: 0
  });

  tl.to(finalLogo, {
    duration: 0.6,
    opacity: 1,
    ease: "power2.out"
  });
};
</script>
