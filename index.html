<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Validaté Animation</title>
<style>
  body {
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  svg {
    width: 400px;
  }
</style>
</head>
<body>

<svg width="392" height="302" viewBox="0 0 392 302" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ESFERA NARANJA -->
  <rect id="shape1" width="245.001" height="245" rx="122.5" transform="matrix(-1 0 0 1 273.693 28.9868)" fill="#F16347"/>

  <!-- ESFERA AMARILLA -->
  <path id="shape2" fill-rule="evenodd" clip-rule="evenodd"
    d="M363.307 151.487C363.307 83.8319 308.462 28.9869 240.807 28.9869C236.113 28.9869 231.48 29.2509 226.924 29.7649C216.432 29.6063 205.908 32.1063 196.448 37.2649C196.191 37.3648 195.935 37.4655 195.679 37.5671C195.734 37.5853 195.829 37.5724 195.955 37.5369C191.075 40.2569 186.485 43.6901 182.338 47.8365L132.458 97.7166C108.352 121.822 108.352 160.905 132.457 185.01C148.351 200.904 170.757 206.318 191.087 201.253C201.751 198.678 211.862 193.228 220.187 184.903L268.291 136.799C269.49 135.6 270.622 134.388 271.689 133.165C272.585 139.142 273.05 145.26 273.05 151.487C273.05 203.205 241 247.437 195.678 265.406C209.644 270.943 224.87 273.987 240.807 273.987C308.462 273.987 363.307 219.142 363.307 151.487Z"
    fill="#F0DC29"/>
</svg>

<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/MotionPathPlugin.min.js"></script>

<script>
gsap.registerPlugin(MotionPathPlugin);

const shape1 = document.getElementById("shape1");
const shape2 = document.getElementById("shape2");

const tl = gsap.timeline({ repeat: -1, yoyo: true });

tl.to(shape1, {
  duration: 2.5,
  motionPath: {
    path: [
      {x: 0, y: 0},
      {x: 80, y: -40},
      {x: 160, y: 0},
      {x: 80, y: 40},
      {x: 0, y: 0}
    ],
    curviness: 1.5
  },
  rotation: 360,
  ease: "power1.inOut"
}, 0);

tl.to(shape2, {
  duration: 2.5,
  motionPath: {
    path: [
      {x: 0, y: 0},
      {x: -80, y: 40},
      {x: -160, y: 0},
      {x: -80, y: -40},
      {x: 0, y: 0}
    ],
    curviness: 1.5
  },
  rotation: -360,
  ease: "power1.inOut"
}, 0);
</script>

</body>
</html>
